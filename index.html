<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>La Boussole — Actualité politique, cap à gauche</title>
  <meta name="description" content="Actualité politique française, panorama des partis et candidats à la présidentielle 2027." />

  <!-- Tailwind (CDN, pas de build) -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- React + ReactDOM + Babel (transforme le JSX directement dans le navigateur) -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js" crossorigin></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Source+Serif+4:ital,wght@0,400;0,600;0,700;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap');
    :root {
      --paper: #EFEAE0;
      --ink: #17140F;
      --red: #C81E3A;
      --red-dark: #8C1327;
      --gold: #C9972B;
      --green: #1F5C4A;
      --line: #D8D0BE;
    }
    html, body, #root { min-height: 100%; }
    body { margin: 0; background: var(--paper); font-family: 'Source Serif 4', serif; }
    * { box-sizing: border-box; }
    button:focus-visible, a:focus-visible { outline: 2px solid var(--red); outline-offset: 2px; }
    @keyframes ticker { from { transform: translateX(0); } to { transform: translateX(-50%); } }
    @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
  </style>
</head>
<body>
  <div id="root">
    <p style="padding:2rem;font-family:monospace;color:#8a8272;">Chargement de La Boussole…</p>
  </div>

  <script type="text/babel" src="app.js"></script>
</body>
</html>
